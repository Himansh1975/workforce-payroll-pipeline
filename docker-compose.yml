services:
  # Airflow UI + scheduler in one container: http://localhost:8080
  airflow:
    build: .
    image: workforce-pipeline:latest
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_TARGET: ${DBT_TARGET:-dev}
      GCP_PROJECT: ${GCP_PROJECT:-}
      BQ_LOCATION: ${BQ_LOCATION:-US}
    volumes:
      - .:/opt/project

  # One-off commands without Airflow:
  #   docker compose run --rm cli "python -m pipeline.run --start 2026-11-10 --end 2026-11-12"
  cli:
    build: .
    image: workforce-pipeline:latest
    profiles: ["cli"]
    entrypoint: ["/bin/bash", "-c"]
    environment:
      DBT_TARGET: ${DBT_TARGET:-dev}
      GCP_PROJECT: ${GCP_PROJECT:-}
      BQ_LOCATION: ${BQ_LOCATION:-US}
    volumes:
      - .:/opt/project
