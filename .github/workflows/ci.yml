name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyspark==3.5.3 pytest "dbt-duckdb~=1.9.0"
      - name: Unit tests
        run: pytest -q
      - name: Run the pipeline for three days
        run: python -m pipeline.run --start 2026-11-10 --end 2026-11-12
      - name: Build and test the warehouse
        run: cd dbt && dbt build --profiles-dir .
